target-version = "py312"
line-length = 110

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "DTZ", "BLE"]
ignore = [
  "B008",    # FastAPI: Depends()/Query() in argument defaults is the idiom
  "S101",    # assert is expected in tests
]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]   # test fixtures legitimately hold tokens/passwords
"alembic/**" = ["E501", "I001"]
"scripts/**" = ["E501"]
# Long Italian user-facing messages/formulas: keep them on one line for greppability.
"app/modules/management/service.py" = ["E501"]
"app/modules/assistant/service.py" = ["E501"]
"app/modules/treasury/analytics.py" = ["E501"]
"app/modules/treasury/service.py" = ["E501"]
"app/modules/treasury/providers/sandbox.py" = ["E501"]
"app/modules/cockpit/service.py" = ["E501"]
