services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prosperya
      POSTGRES_PASSWORD: prosperya
      POSTGRES_DB: prosperya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosperya"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://prosperya:prosperya@db:5432/prosperya
      CORS_ORIGINS: http://localhost:5173
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
