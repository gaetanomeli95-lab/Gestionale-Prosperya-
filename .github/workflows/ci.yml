name: CI

on:
  push:
    branches: [main, "integration/**", "rebuild/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- fast PR gate
  backend-fast:
    name: backend · lint + tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - run: pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic scripts
      - name: Tests (in-memory SQLite)
        working-directory: backend
        run: pytest tests -q -p no:cacheprovider

  frontend:
    name: frontend · typecheck + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run lint
      - name: Unit / component tests (Vitest)
        run: cd frontend && npm test
      - name: Production build
        run: cd frontend && npm run build

  # ------------------------------------------------------- heavier integration gate
  backend-postgres:
    name: backend · migrations + seed + tests (PostgreSQL 16.15)
    runs-on: ubuntu-latest
    needs: backend-fast
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: prosperya
          POSTGRES_PASSWORD: prosperya
          POSTGRES_DB: prosperya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prosperya"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://prosperya:prosperya@localhost:5432/prosperya
      JWT_SECRET: ci-secret-key-with-32-plus-bytes!!
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - run: pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Migrations — empty → head → base → head
        working-directory: backend
        env: { DATABASE_URL: "${{ env.PG_URL }}" }
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          alembic downgrade base
          alembic upgrade head
      - name: Seed twice (idempotency) incl. preview dataset
        working-directory: backend
        env:
          DATABASE_URL: "${{ env.PG_URL }}"
          PROSPERYA_PREVIEW: "1"
          SEED_ADMIN_EMAIL: demo@prosperya.it
          SEED_ADMIN_PASSWORD: Prosperya-Demo-2026
        run: python -m scripts.seed_check
      - name: Full test suite on PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://prosperya:prosperya@localhost:5432/prosperya_test
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://prosperya:prosperya@localhost:5432/postgres", autocommit=True) as c:
              c.execute("CREATE DATABASE prosperya_test")
          PY
          pytest tests -q -p no:cacheprovider

  e2e:
    name: e2e · 5 smoke flows (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-fast, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Smoke flows
        working-directory: frontend
        env: { CI: "1" }
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
