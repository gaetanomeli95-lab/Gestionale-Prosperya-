name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prosperya
          POSTGRES_PASSWORD: prosperya
          POSTGRES_DB: prosperya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prosperya"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: cd backend && ruff check app tests
      - name: Migration check (empty Postgres → upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://prosperya:prosperya@localhost:5432/prosperya
          JWT_SECRET: ci-secret-key-with-32-plus-bytes!!
        run: alembic upgrade head
      - name: Tests (SQLite)
        working-directory: backend
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck + build
        run: cd frontend && npm run build
